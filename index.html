<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Theatre Ticketing</title>
</head>
<body>
  <header>
    <h1>Interactive Theatre Ticketing</h1>
    <p>Choose your seat and enjoy the show.</p>
  </header>

  <main>
    <section>
      <h2>Theatre Map</h2>
      <p>Stage</p>
      <p>The seating map will appear here.</p>
    </section>

    <section>
      <h2>Seat Details</h2>
      <p>Select a seat to see its details and price.</p>
    </section>

    <section>
      <h2>Your Cart</h2>
      <p>Your selected tickets will appear here.</p>
      <p>Total: 0 AZN</p>
    </section>
  </main>
</body>
</html>
